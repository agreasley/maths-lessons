project:
  type: website
  output-dir: _site
  # Render children before their listing pages so a fresh build resolves HTML links.
  render:
    - "courses/**/lesson-*.qmd"
    - "courses/*/*/index.qmd"
    - "courses/*/index.qmd"
    - index.qmd

website:
  title: "Maths lessons"
  navbar:
    background: "#152e3b"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: All courses
  search: false
  page-footer:
    left: "Maths lessons · Years 7–12"
    right: "Choose a course. Explore a topic. Open a lesson."

lang: en-AU
editor: source
