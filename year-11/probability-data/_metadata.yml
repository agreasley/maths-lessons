format:
  revealjs:
    theme: simple
    css: ../../assets/lesson.css
    include-in-header:
      text: |
        <meta name="lesson-topic-url" content="../../courses/year-11-mathematics-advanced/probability-data/index.html">
    include-after-body:
      text: |
        <script src="../../assets/lesson.js"></script>
    width: 1280
    height: 800
    margin: 0.09
    center: false
    transition: none
    background-transition: none
    controls: false
    touch: false
    hash: true
    history: true
    slide-number: c/t
    progress: true
    menu: false
    overview: true
    title-slide: false
    embed-resources: true
    self-contained-math: true
    html-math-method: katex
    navigation-mode: linear
    slide-level: 2
